kind: device-fault-registry
description: >-
  Device fault codes emitted by Moxion Mobile Power Units. Faults represent
  abnormal device state or operation; the device emits a fault with a specific
  code when it detects the associated conditions. Current active faults are
  fetched from the Fleet Faults Snapshot API
  (FleetFaultSnapshotController_listEquipmentAempFaultSnapshot) or the
  per-device faults endpoint (DeviceFaultsController_listFaults). The
  moxion_severity field indicates whether Moxion considers the fault CRITICAL
  or INFO; each user/use case may define "critical" differently.
faults:
