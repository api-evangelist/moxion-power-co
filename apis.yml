aid: moxion-power-co
name: Moxion Power Co
description: >-
  Moxion Power Co is a mobile energy storage company (a Y Combinator alum) that
  builds trailer-mounted, zero-emission Mobile Power Units (MPUs) used as
  quiet, clean replacements for diesel generators on construction sites, film
  productions, events, and grid-support jobs. Moxion operated a REST Developer
  API that let fleet operators fetch device metadata, real-time GPS location,
  and time-series telemetry (state of charge, pack voltage, net/output power,
  energy available/capacity, cellular signal) for their Mobile Power Units,
  along with active fault codes. The API additionally exposed AEMP 2.0
  (ISO 15143-3 v.20190501) compliant fleet-snapshot endpoints so telematics
  platforms could ingest Moxion equipment alongside other heavy-equipment
  fleets. Authentication used bearer tokens issued to Service Accounts. Note
  the company filed for bankruptcy in August 2024; the developer documentation
  remains online but the API host may no longer be operational.
